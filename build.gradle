buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('username')) args '--username', project.property('username')
            // Сразу в тестовый мир (scripts/make_test_world.py): -Pworld="RP Sports test"
            if (project.hasProperty('world')) args '--quickPlaySingleplayer', project.property('world')
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Проверка загрузки (мод + RP Core без остальных): ./gradlew runGameTestServer — сервер стартует и выходит.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

// Клиентские вставки: клавиши мини-игр с приоритетом (KeyboardHandlerMixin), камера вокруг персонажа (CameraMixin).
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// RP Core (обязательная зависимость семейства RP) — jar в libs/.
repositories {
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // RP Core — общая библиотека семейства: навыки, черты, общий HUD и редактор.
    implementation fg.deobf("blank:rpcore:${rpcore_version}")
    implementation fg.deobf("blank:rpstamina:${rpstamina_version}")
    implementation fg.deobf("blank:player-animation-lib-forge:${playeranim_version}")
    // bendy-lib — сгибы локтей и коленей в эмоциях (в сборке есть; аддону не обязательна).
    runtimeOnly fg.deobf("blank:bendy-lib-forge:${bendylib_version}")
    // Проверка вместе с семьёй: -Pwith_family=true (Perks + Culinary) или по одному: -Pwith_perks=true, -Pwith_culinary=true.
    def flag = { String name -> (project.findProperty(name) ?: 'false').toString().toBoolean() }
    boolean family = flag('with_family')
    if (family || flag('with_perks')) runtimeOnly fg.deobf("blank:rpperks:${rpperks_version}")
    if (family || flag('with_culinary')) runtimeOnly fg.deobf("blank:rpculinary:${rpculinary_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
